<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="#F8FAFC" rx="8"/>

  <!-- 标题 -->
  <text x="450" y="28" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">记忆操作在状态图各阶段的分布</text>

  <!-- ========== 主流程节点 ========== -->
  <!-- 意图识别 -->
  <rect x="30" y="60" width="100" height="44" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" filter="url(#ds)"/>
  <text x="80" y="87" font-size="12" fill="#D97706" text-anchor="middle" font-weight="bold">意图识别</text>

  <!-- 上下文组装 -->
  <rect x="180" y="55" width="130" height="54" rx="8" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2" filter="url(#ds)"/>
  <text x="245" y="78" font-size="12" fill="#0284C7" text-anchor="middle" font-weight="bold">上下文组装</text>
  <text x="245" y="96" font-size="9.5" fill="#0369A1" text-anchor="middle">含记忆召回</text>

  <!-- 生成/修改 -->
  <rect x="360" y="60" width="110" height="44" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5" filter="url(#ds)"/>
  <text x="415" y="87" font-size="12" fill="#0D9488" text-anchor="middle" font-weight="bold">生成/修改</text>

  <!-- 反思校验 -->
  <rect x="520" y="60" width="100" height="44" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" filter="url(#ds)"/>
  <text x="570" y="87" font-size="12" fill="#9333EA" text-anchor="middle" font-weight="bold">反思校验</text>

  <!-- END -->
  <rect x="670" y="60" width="80" height="44" rx="8" fill="#6366F1" filter="url(#ds)"/>
  <text x="710" y="87" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">END</text>

  <!-- 箭头 -->
  <line x1="130" y1="82" x2="175" y2="82" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="172,79 172,85 178,82" fill="#94A3B8"/>
  <line x1="310" y1="82" x2="355" y2="82" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="352,79 352,85 358,82" fill="#94A3B8"/>
  <line x1="470" y1="82" x2="515" y2="82" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="512,79 512,85 518,82" fill="#94A3B8"/>
  <line x1="620" y1="82" x2="665" y2="82" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="662,79 662,85 668,82" fill="#94A3B8"/>

  <!-- ========== Checkpointer 横切层 ========== -->
  <rect x="30" y="140" width="720" height="50" rx="8" fill="#FEF3C7" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="50" y="160" font-size="11" fill="#92400E" font-weight="bold">Checkpointer（框架自动，横切）</text>
  <text x="50" y="178" font-size="10" fill="#B45309">每个节点执行后 State 自动落 PostgreSQL · 按 thread_id 持久化 · 支持中断/恢复</text>

  <!-- 横切箭头标识 -->
  <text x="390" y="135" font-size="16" text-anchor="middle">↕</text>

  <!-- ========== 记忆操作归属区 ========== -->

  <!-- 召回区 -->
  <rect x="180" y="215" width="130" height="95" rx="8" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#ds)"/>
  <text x="245" y="234" font-size="11" fill="#0284C7" text-anchor="middle" font-weight="bold">召回 + 判断</text>
  <line x1="195" y1="240" x2="295" y2="240" stroke="#BAE6FD" stroke-width="1"/>
  <text x="190" y="255" font-size="9.5" fill="#0369A1">· 策略：按 intent 决定</text>
  <text x="190" y="270" font-size="9.5" fill="#0369A1">· 短期：Checkpointer 取</text>
  <text x="190" y="285" font-size="9.5" fill="#0369A1">· 长期：Store 向量检索</text>
  <text x="190" y="300" font-size="9.5" fill="#0369A1">· 画像：按需注入</text>

  <!-- 连接线：上下文组装 → 召回 -->
  <line x1="245" y1="109" x2="245" y2="215" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="255" y="165" font-size="9" fill="#0EA5E9">内聚于</text>

  <!-- 摘要更新区 -->
  <rect x="360" y="215" width="110" height="75" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5" filter="url(#ds)"/>
  <text x="415" y="234" font-size="11" fill="#0D9488" text-anchor="middle" font-weight="bold">摘要更新</text>
  <line x1="375" y1="240" x2="455" y2="240" stroke="#99F6E4" stroke-width="1"/>
  <text x="370" y="255" font-size="9.5" fill="#0F766E">· 滚动摘要生成</text>
  <text x="370" y="270" font-size="9.5" fill="#0F766E">· 写回 State</text>
  <text x="370" y="285" font-size="9.5" fill="#0F766E">· Checkpointer 自动落库</text>

  <!-- 连接线：生成 → 摘要 -->
  <line x1="415" y1="104" x2="415" y2="215" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 长期记忆 + 画像区 -->
  <rect x="620" y="215" width="160" height="95" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#ds)"/>
  <text x="700" y="234" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">长期记忆 + 画像更新</text>
  <line x1="635" y1="240" x2="765" y2="240" stroke="#CBD5E1" stroke-width="1"/>
  <text x="630" y="255" font-size="9.5" fill="#475569">· Store.put: 摘要+关键词+向量</text>
  <text x="630" y="270" font-size="9.5" fill="#475569">· Store.put: 画像偏好</text>
  <text x="630" y="285" font-size="9.5" fill="#475569">· 异步执行，不阻塞主流程</text>
  <text x="630" y="300" font-size="9.5" fill="#475569">· 不在状态图中体现</text>

  <!-- 连接线：END → 长期记忆 -->
  <line x1="710" y1="104" x2="710" y2="215" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ========== 结论 ========== -->
  <rect x="30" y="335" width="750" height="70" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="50" y="357" font-size="11" fill="#475569" font-weight="bold">结论：记忆不是节点，是横切关注点</text>
  <text x="50" y="375" font-size="10" fill="#64748B">召回内聚于上下文组装节点（策略依赖 intent，结果直接进 Prompt，拆开增加 State 传递而无收益）</text>
  <text x="50" y="390" font-size="10" fill="#64748B">储存由 Checkpointer 框架自动完成（每节点后执行，无法用图节点表达）</text>
  <text x="50" y="405" font-size="10" fill="#64748B">更新分散在生成节点（摘要）和 END 后处理（长期记忆，异步，不影响主流程延迟）</text>
</svg>