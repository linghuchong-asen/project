<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif">
  <filter id="sh" x="-5%" y="-10%" width="115%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.08"/>
  </filter>

  <!-- 背景 -->
  <rect width="1100" height="760" fill="#F8FAFC" rx="8"/>

  <!-- ======================== 边 + 手动箭头 ======================== -->

  <!-- 1. START → 意图识别 (向下) -->
  <path d="M550,67 V100" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="545,92 555,92 550,100" fill="#94A3B8"/>

  <!-- 2. 意图识别 → 上下文组装 (向下) -->
  <path d="M550,166 V220" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="545,212 555,212 550,220" fill="#94A3B8"/>

  <!-- 3. 上下文组装 → 生成/修改 (向下) -->
  <path d="M550,286 V314" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="545,306 555,306 550,314" fill="#94A3B8"/>

  <!-- 4. 生成/修改 → 反思校验 (向下) -->
  <path d="M550,384 V434" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="545,426 555,426 550,434" fill="#94A3B8"/>

  <!-- 5. 意图识别 → 用户咨询 (向右) -->
  <path d="M645,136 H784" stroke="#22C55E" stroke-width="2" fill="none"/>
  <polygon points="776,131 776,141 784,136" fill="#22C55E"/>

  <!-- 6. 用户咨询 → END (向左进入END右侧) -->
  <path d="M950,136 H1020 V660 H606" stroke="#22C55E" stroke-width="2" fill="none"/>
  <polygon points="614,655 614,665 606,660" fill="#22C55E"/>

  <!-- 7. 生成/修改 → 工具调用 (向左) -->
  <path d="M450,339 H323" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="331,334 331,344 323,339" fill="#94A3B8"/>

  <!-- 8. 工具调用 → 生成/修改 (向右，回退虚线) -->
  <path d="M317,365 H444" stroke="#F43F5E" stroke-width="2" stroke-dasharray="7,4" fill="none"/>
  <polygon points="436,360 436,370 444,365" fill="#F43F5E"/>

  <!-- 9. 反思校验 → END (向下) -->
  <path d="M550,504 V633" stroke="#22C55E" stroke-width="2" fill="none"/>
  <polygon points="545,625 555,625 550,633" fill="#22C55E"/>

  <!-- 10. 反思校验 → 生成/修改 (向左，回退虚线) -->
  <path d="M650,464 H700 V364 H656" stroke="#F43F5E" stroke-width="2" stroke-dasharray="7,4" fill="none"/>
  <polygon points="664,359 664,369 656,364" fill="#F43F5E"/>

  <!-- 11. 反思校验 → 用户确认 (向右) -->
  <path d="M650,472 H779" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="771,467 771,477 779,472" fill="#94A3B8"/>

  <!-- 12. 用户确认 → 生成/修改 (向左，回退虚线) -->
  <path d="M955,472 H990 V324 H656" stroke="#F43F5E" stroke-width="2" stroke-dasharray="7,4" fill="none"/>
  <polygon points="664,319 664,329 656,324" fill="#F43F5E"/>

  <!-- ======================== 节点 ======================== -->

  <!-- START -->
  <rect x="500" y="25" width="100" height="42" rx="21" fill="#6366F1" filter="url(#sh)"/>
  <text x="550" y="52" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">START</text>

  <!-- 意图识别 -->
  <rect x="455" y="106" width="190" height="60" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="550" y="131" font-size="14" fill="#D97706" text-anchor="middle" font-weight="bold">意图识别</text>
  <text x="550" y="151" font-size="11" fill="#B45309" text-anchor="middle">规则优先，模型兜底</text>

  <!-- 上下文组装 -->
  <rect x="455" y="226" width="190" height="60" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="550" y="251" font-size="13" fill="#0284C7" text-anchor="middle" font-weight="bold">上下文组装</text>
  <text x="550" y="271" font-size="10.5" fill="#0369A1" text-anchor="middle">Prompt · 记忆 · 画布 · Schema引导</text>

  <!-- 用户咨询 -->
  <rect x="790" y="108" width="160" height="56" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" filter="url(#sh)"/>
  <text x="870" y="132" font-size="13" fill="#16A34A" text-anchor="middle" font-weight="bold">用户咨询</text>
  <text x="870" y="151" font-size="10.5" fill="#15803D" text-anchor="middle">纯问答，直达 END</text>

  <!-- 生成/修改 -->
  <rect x="450" y="320" width="200" height="64" rx="10" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="550" y="347" font-size="14" fill="#0D9488" text-anchor="middle" font-weight="bold">生成 / 修改</text>
  <text x="550" y="367" font-size="10.5" fill="#0F766E" text-anchor="middle">generate:全量Draft / modify:增量Op</text>

  <!-- 工具调用 -->
  <rect x="142" y="322" width="175" height="60" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5" filter="url(#sh)"/>
  <text x="230" y="347" font-size="13" fill="#DB2777" text-anchor="middle" font-weight="bold">工具调用</text>
  <text x="230" y="367" font-size="10.5" fill="#BE185D" text-anchor="middle">Skill / MCP 重试或降级</text>

  <!-- 反思校验 -->
  <rect x="450" y="440" width="200" height="64" rx="10" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="550" y="467" font-size="14" fill="#9333EA" text-anchor="middle" font-weight="bold">反思校验</text>
  <text x="550" y="487" font-size="11" fill="#7E22CE" text-anchor="middle">Zod Schema + 图遍历</text>

  <!-- 用户确认 -->
  <rect x="785" y="442" width="170" height="60" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="870" y="467" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">用户确认</text>
  <text x="870" y="487" font-size="10.5" fill="#475569" text-anchor="middle">模糊语义 → SSE → 前端</text>

  <!-- END -->
  <rect x="500" y="639" width="100" height="42" rx="21" fill="#6366F1" filter="url(#sh)"/>
  <text x="550" y="666" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">END</text>

  <!-- ======================== 边标签 ======================== -->

  <!-- generate / modify -->
  <rect x="560" y="171" width="104" height="20" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="612" y="185" font-size="11" fill="#D97706" text-anchor="middle" font-weight="bold">generate / modify</text>

  <!-- consult（上移） -->
  <rect x="686" y="110" width="56" height="20" rx="4" fill="#F0FDF4" stroke="#22C55E" stroke-width="1"/>
  <text x="714" y="124" font-size="11" fill="#16A34A" text-anchor="middle" font-weight="bold">consult</text>

  <!-- 需要外部能力 -->
  <rect x="345" y="321" width="82" height="20" rx="4" fill="#FDF2F8" stroke="#EC4899" stroke-width="1"/>
  <text x="386" y="335" font-size="11" fill="#DB2777" text-anchor="middle">需要外部能力</text>

  <!-- 结果注入 -->
  <rect x="350" y="371" width="60" height="20" rx="4" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="380" y="385" font-size="11" fill="#F43F5E" text-anchor="middle">结果注入</text>

  <!-- 通过 -->
  <rect x="557" y="560" width="36" height="20" rx="4" fill="#F0FDF4" stroke="#22C55E" stroke-width="1"/>
  <text x="575" y="574" font-size="11" fill="#16A34A" text-anchor="middle" font-weight="bold">通过</text>

  <!-- 格式/结构问题 -->
  <rect x="700" y="400" width="90" height="20" rx="4" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="745" y="414" font-size="11" fill="#F43F5E" text-anchor="middle">格式/结构问题</text>

  <!-- 模糊语义（边下方） -->
  <rect x="681" y="478" width="68" height="20" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
  <text x="715" y="492" font-size="11" fill="#475569" text-anchor="middle">模糊语义</text>

  <!-- 确认后继续（边左侧） -->
  <rect x="910" y="364" width="70" height="20" rx="4" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="945" y="378" font-size="11" fill="#F43F5E" text-anchor="middle">确认后继续</text>


</svg>
